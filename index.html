<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRUPESODE — Gaming & Educational Software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Inter', system-ui, sans-serif;
      color: #e8e8f0;
      padding: 1.5rem 1rem;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.22), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.12), transparent),
        radial-gradient(ellipse 50% 30% at 10% 80%, rgba(59, 130, 246, 0.1), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.9rem, 9vw, 4.2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #a5b4fc 0%, #c4b5fd 45%, #f0abfc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.25rem;
      line-height: 1.15;
      word-break: break-word;
    }

    .tagline {
      font-size: clamp(0.95rem, 3.2vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #a1a1b5;
      line-height: 1.65;
      margin-bottom: 2rem;
      max-width: 28rem;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      max-width: 320px;
      margin-bottom: 2.5rem;
    }

    .service {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      color: #d4d4e8;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .service:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(167, 139, 250, 0.35);
    }

    .service span {
      display: block;
      font-size: 0.78rem;
      font-weight: 400;
      color: #8b8ba0;
      margin-top: 0.2rem;
    }

    .contacts {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
    }

    .contact-item {
      font-size: 0.92rem;
      color: #b0b0c8;
      line-height: 1.4;
    }

    .contact-item a {
      color: #c4b5fd;
      text-decoration: none;
      transition: color 0.2s ease;
      word-break: break-all;
    }

    .contact-item a:hover {
      color: #e9d5ff;
    }

    .contact-label {
      color: #7a7a94;
      margin-right: 0.35rem;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: #5a5a70;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }

    /* Desktop improvements */
    @media (min-width: 640px) {
      body {
        padding: 2rem;
      }

      .logo {
        letter-spacing: 0.1em;
        margin-bottom: 1.5rem;
      }

      .tagline {
        margin-bottom: 2.5rem;
      }

      .services {
        flex-direction: row;
        justify-content: center;
        max-width: none;
        gap: 1.1rem;
      }

      .service {
        padding: 1.1rem 1.6rem;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="logo">GRUPESODE</h1>
    <p class="tagline">
      Crafting immersive gaming experiences<br>
      and effective educational software
    </p>

    <div class="services">
      <div class="service">
        Game Development
        <span>Engaging worlds & mechanics</span>
      </div>
      <div class="service">
        Educational Software
        <span>Learning that sticks</span>
      </div>
    </div>

    <div class="contacts">
      <div class="contact-item">
        <span class="contact-label">Telegram —</span>
        <a href="https://t.me/indra_minsk" target="_blank" rel="noopener">@indra_minsk</a>
      </div>
      <div class="contact-item">
        <span class="contact-label">Gmail —</span>
        <a href="mailto:indraminsk@gmail.com">indraminsk@gmail.com</a>
      </div>
      <div class="contact-item">
        <span class="contact-label">WhatsApp —</span>
        <a href="https://wa.me/393312670800" target="_blank" rel="noopener">+39 331 267 0800</a>
      </div>
    </div>
  </div>

  <footer>© 2026 GRUPESODE</footer>
</body>
</html>
